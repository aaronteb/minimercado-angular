<!-- Loader - NUEVO -->
<app-loader *ngIf="cargando"></app-loader>

<!-- Mensaje de respuesta (éxito/error) -->
<app-respuesta
  [mensaje]="mensaje"
  [tipo]="tipo"
  [visible]="mostrarMensaje && !cargando">
</app-respuesta>

<!-- Login -->
<div class="login-wrapper" *ngIf="!mostrarRecuperacion && !cargando">
  <div class="login-container">
    
    <div class="login-header">
      <div class="logo-icon">
        <i class="fas fa-store"></i>
      </div>
      <h2>Minimercado</h2>
    </div>

    <form (ngSubmit)="login()" class="login-form">
      
      <!-- Email -->
      <div class="form-group">
        <div class="input-wrapper">
          <i class="fas fa-user"></i>
          <input 
            id="email" 
            type="email" 
            [(ngModel)]="email" 
            name="email" 
            placeholder="Email"
            [disabled]="cargando"
            required
          />
        </div>
      </div>

      <!-- Contraseña -->
      <div class="form-group">
        <div class="input-wrapper">
          <i class="fas fa-lock"></i>
          <input 
            id="password" 
            type="password" 
            [(ngModel)]="password" 
            name="password" 
            placeholder="Contraseña"
            [disabled]="cargando"
            required
          />
        </div>
      </div>

      <!-- Botón de login -->
      <button type="submit" class="login-btn" [disabled]="cargando">
        <i class="fas fa-sign-in-alt" *ngIf="!cargando"></i>
        <i class="fas fa-spinner fa-spin" *ngIf="cargando"></i>
        {{ cargando ? 'Ingresando...' : 'Ingresar' }}
      </button>

      <!-- Enlace de recuperar contraseña -->
      <p class="forgot-password" (click)="mostrarRecuperacion = true" [class.disabled]="cargando">
        ¿Olvidaste tu contraseña?
      </p>

    </form>
  </div>
</div>

<!-- Recuperar Contraseña -->
<div *ngIf="mostrarRecuperacion && !cargando">
  <app-recuperar-contrasena (volver)="mostrarRecuperacion = false"></app-recuperar-contrasena>
</div>
