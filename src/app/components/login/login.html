<!-- Mensaje de respuesta (éxito/error) -->
<app-respuesta
  [mensaje]="mensaje"
  [tipo]="tipo"
  [visible]="mostrarMensaje">
</app-respuesta>

<!-- Login -->
<div class="login-wrapper" *ngIf="!mostrarRecuperacion">
  <div class="login-container">
    
    <div class="login-header">
      <div class="logo-icon">
        <i class="fas fa-store"></i>
      </div>
      <h2>Minimercado</h2>
    </div>

    <form (ngSubmit)="login()" class="login-form">
      
      <!-- Email -->
      <div class="form-group">
        <div class="input-wrapper">
          <i class="fas fa-user"></i>
          <input 
            id="email" 
            type="email" 
            [(ngModel)]="email" 
            name="email" 
            placeholder="Email"
            required
          />
        </div>
      </div>

      <!-- Contraseña -->
      <div class="form-group">
        <div class="input-wrapper">
          <i class="fas fa-lock"></i>
          <input 
            id="password" 
            type="password" 
            [(ngModel)]="password" 
            name="password" 
            placeholder="Contraseña"
            required
          />
        </div>
      </div>

      <!-- Botón de login -->
      <button type="submit" class="login-btn">
        <i class="fas fa-sign-in-alt"></i>
        Ingresar
      </button>

      <!-- Botón de recuperar contraseña -->
      <button type="button" class="link-btn" (click)="mostrarRecuperacion = true">
        ¿Olvidaste tu contraseña?
      </button>

    </form>
  </div>
</div>

<!-- Recuperar Contraseña -->
<div *ngIf="mostrarRecuperacion">
  <app-recuperar-contrasena (volver)="mostrarRecuperacion = false"></app-recuperar-contrasena>
</div>
