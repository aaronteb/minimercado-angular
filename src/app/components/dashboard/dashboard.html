<div class="dashboard-wrapper">
  
  <!-- Header -->
  <header class="dashboard-header">
    <div class="header-content">
      <div class="logo-section">
        <div class="logo-icon">
          <i class="fas fa-store"></i>
        </div>
        <h1>Minimercado Dashboard</h1>
      </div>
      
      <div class="user-section">
        <span class="welcome-text">{{ userEmail }}</span>
        <button class="logout-btn" (click)="logout()">
          <i class="fas fa-sign-out-alt"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="dashboard-content">
    
    <!-- Secciones Grid -->
    <div class="secciones-grid">
      <div 
        *ngFor="let seccion of secciones" 
        class="seccion-card"
        (click)="seleccionarSeccion(seccion)"
        [style.border-color]="seccion.color">
        
        <div class="seccion-header">
          <div class="seccion-icon" [style.background-color]="seccion.color">
            <i [class]="seccion.icono"></i>
          </div>
          <h3>{{ seccion.titulo }}</h3>
        </div>
        
        <p class="seccion-descripcion">{{ seccion.descripcion }}</p>
        
        <div class="seccion-arrow">
          <i class="fas fa-chevron-right"></i>
        </div>
      </div>
    </div>

  </main>
</div>
